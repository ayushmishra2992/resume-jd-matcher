</text><rect x="480" y="112" width="220" height="52" rx="8" fill="#e8f0fe" stroke="#3367d6" stroke-width="1.6"/><text x="590.0" y="134.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Requirements (JSON)</text><text x="590.0" y="149.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">id, name, category, priority</text><rect x="480" y="174" width="220" height="52" rx="8" fill="#e8f0fe" stroke="#3367d6" stroke-width="1.6"/><text x="590.0" y="196.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Matches (JSON)</text><text x="590.0" y="211.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">status, evidence quote, reason</text><rect x="480" y="236" width="220" height="52" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.6"/><text x="590.0" y="258.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Verified rows + score</text><text x="590.0" y="273.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">0-100, band, unverified count</text><line x1="440" y1="145" x2="480" y2="76" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><line x1="440" y1="145" x2="480" y2="138" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><line x1="440" y1="145" x2="480" y2="200" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><line x1="440" y1="145" x2="480" y2="262" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="760" y="50" width="220" height="40" rx="8" fill="#fff6e5" stroke="#c77700" stroke-width="1.6"/><text x="870.0" y="74.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Match score + verdict</text><line x1="700" y1="76" x2="760" y2="70" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="760" y="102" width="220" height="40" rx="8" fill="#fff6e5" stroke="#c77700" stroke-width="1.6"/><text x="870.0" y="126.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Requirement match table</text><line x1="700" y1="138" x2="760" y2="122" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="760" y="154" width="220" height="40" rx="8" fill="#fff6e5" stroke="#c77700" stroke-width="1.6"/><text x="870.0" y="178.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Rewritten bullets</text><line x1="700" y1="200" x2="760" y2="174" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="760" y="206" width="220" height="40" rx="8" fill="#fff6e5" stroke="#c77700" stroke-width="1.6"/><text x="870.0" y="230.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Gaps, actions, 4-week plan</text><line x1="700" y1="262" x2="760" y2="226" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="760" y="258" width="220" height="40" rx="8" fill="#fff6e5" stroke="#c77700" stroke-width="1.6"/><text x="870.0" y="282.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Download .md / .json</text><line x1="700" y1="262" x2="760" y2="278" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="500" y="335" font-size="12" font-weight="normal" text-anchor="middle" fill="#555">Every model output is JSON; Python checks it before the next step uses it.</text></svg>