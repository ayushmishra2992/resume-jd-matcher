<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="500.0" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">Figure 1 - Prompt workflow (final version, 5 prompts)</text><rect x="20" y="70" width="170" height="62" rx="8" fill="#fff6e5" stroke="#c77700" stroke-width="1.6"/><text x="105.0" y="97.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Inputs</text><text x="105.0" y="112.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">resume + job description</text><rect x="270" y="70" width="170" height="62" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.6"/><text x="355.0" y="97.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">PII redaction</text><text x="355.0" y="112.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">email, phone, links</text><rect x="520" y="70" width="170" height="62" rx="8" fill="#e8f0fe" stroke="#3367d6" stroke-width="1.6"/><text x="605.0" y="97.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">P1 Input Guard</text><text x="605.0" y="112.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">valid? injection? T=0.0</text><rect x="790" y="70" width="170" height="62" rx="8" fill="#e8f0fe" stroke="#3367d6" stroke-width="1.6"/><text x="875.0" y="97.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">P2 JD Extractor</text><text x="875.0" y="112.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">requirements JSON, T=0.2</text><line x1="190" y1="101" x2="270" y2="101" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><line x1="440" y1="101" x2="520" y2="101" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><line x1="690" y1="101" x2="790" y2="101" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="520" y="190" width="170" height="54" rx="8" fill="#fdecec" stroke="#c62828" stroke-width="1.6"/><text x="605.0" y="213.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Stop: show reason</text><text x="605.0" y="228.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">invalid / empty input</text><line x1="605" y1="132" x2="605" y2="190" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="609.0" y="156.0" font-size="11" font-weight="normal" text-anchor="start" fill="#555">proceed = false</text><text x="505" y="212" font-size="11" font-weight="normal" text-anchor="end" fill="#7b1fa2">if P1 flags injection, that text</text><text x="505" y="227" font-size="11" font-weight="normal" text-anchor="end" fill="#7b1fa2">is removed and analysis continues</text><rect x="790" y="300" width="170" height="62" rx="8" fill="#e8f0fe" stroke="#3367d6" stroke-width="1.6"/><text x="875.0" y="327.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">P3 Evidence Matcher</text><text x="875.0" y="342.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">status + exact quote, T=0.2</text><rect x="540" y="300" width="170" height="62" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.6"/><text x="625.0" y="327.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Verify quotes + score</text><text x="625.0" y="342.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">fuzzy match &gt;= 0.85, rubric</text><rect x="290" y="300" width="170" height="62" rx="8" fill="#e8f0fe" stroke="#3367d6" stroke-width="1.6"/><text x="375.0" y="327.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">P4 Bullet Rewriter</text><text x="375.0" y="342.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">no new facts, T=0.4</text><rect x="40" y="300" width="170" height="62" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.6"/><text x="125.0" y="327.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Number check</text><text x="125.0" y="342.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">flag invented numbers</text><line x1="875" y1="132" x2="875" y2="300" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="879.0" y="211.0" font-size="11" font-weight="normal" text-anchor="start" fill="#555">requirements</text><line x1="790" y1="331" x2="710" y2="331" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><line x1="540" y1="331" x2="460" y2="331" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><line x1="290" y1="331" x2="210" y2="331" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="420" width="170" height="62" rx="8" fill="#e8f0fe" stroke="#3367d6" stroke-width="1.6"/><text x="125.0" y="447.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">P5 Feedback Coach</text><text x="125.0" y="462.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">plan + verdict, T=0.4</text><line x1="125" y1="362" x2="125" y2="420" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="330" y="420" width="300" height="62" rx="8" fill="#fff6e5" stroke="#c77700" stroke-width="1.6"/><text x="480.0" y="447.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Report in app</text><text x="480.0" y="462.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">score, match table, bullets, plan, download</text><line x1="210" y1="451" x2="330" y2="451" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><text x="840" y="440" font-size="11" font-weight="normal" text-anchor="middle" fill="#2e7d32">Score = sum(weight x credit) / sum(weight)</text><text x="840" y="457" font-size="11" font-weight="normal" text-anchor="middle" fill="#2e7d32">required = 2, preferred = 1</text><text x="840" y="474" font-size="11" font-weight="normal" text-anchor="middle" fill="#2e7d32">demonstrated 1, partial 0.5, missing/unverified 0</text><rect x="20" y="500" width="14" height="14" fill="#e8f0fe" stroke="#3367d6"/><text x="40" y="511" font-size="11" font-weight="normal" text-anchor="start" fill="#222">LLM prompt (Gemini)</text><rect x="210" y="500" width="14" height="14" fill="#eef7ee" stroke="#2e7d32"/><text x="230" y="511" font-size="11" font-weight="normal" text-anchor="start" fill="#222">Python code (deterministic)</text><rect x="400" y="500" width="14" height="14" fill="#fff6e5" stroke="#c77700"/><text x="420" y="511" font-size="11" font-weight="normal" text-anchor="start" fill="#222">Input / output</text><rect x="590" y="500" width="14" height="14" fill="#fdecec" stroke="#c62828"/><text x="610" y="511" font-size="11" font-weight="normal" text-anchor="start" fill="#222">Stop / error path</text></svg>