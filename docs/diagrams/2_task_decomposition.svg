<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="500.0" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">Figure 2 - Task decomposition</text><rect x="330" y="50" width="340" height="60" rx="8" fill="#fff6e5" stroke="#c77700" stroke-width="1.6"/><text x="500.0" y="76.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Goal: honest resume-to-job match</text><text x="500.0" y="91.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">with evidence and an action plan</text><rect x="15" y="160" width="152" height="58" rx="8" fill="#e8f0fe" stroke="#3367d6" stroke-width="1.6"/><text x="91.0" y="185.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">1. Check inputs</text><text x="91.0" y="200.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">P1 Input Guard</text><line x1="500" y1="110" x2="91" y2="160" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="18" y="240" width="146" height="30" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.6"/><text x="91.0" y="259.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">usable resume?</text><rect x="18" y="280" width="146" height="30" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.6"/><text x="91.0" y="299.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">usable JD?</text><rect x="18" y="320" width="146" height="30" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.6"/><text x="91.0" y="339.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">injection?</text><rect x="178" y="160" width="152" height="58" rx="8" fill="#e8f0fe" stroke="#3367d6" stroke-width="1.6"/><text x="254.0" y="185.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">2. Understand the job</text><text x="254.0" y="200.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">P2 JD Extractor</text><line x1="500" y1="110" x2="254" y2="160" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="181" y="240" width="146" height="30" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.6"/><text x="254.0" y="259.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">split skills</text><rect x="181" y="280" width="146" height="30" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.6"/><text x="254.0" y="299.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">required vs preferred</text><rect x="181" y="320" width="146" height="30" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.6"/><text x="254.0" y="339.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">normalise names</text><rect x="341" y="160" width="152" height="58" rx="8" fill="#e8f0fe" stroke="#3367d6" stroke-width="1.6"/><text x="417.0" y="185.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">3. Find evidence</text><text x="417.0" y="200.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">P3 Evidence Matcher</text><line x1="500" y1="110" x2="417" y2="160" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="344" y="240" width="146" height="30" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.6"/><text x="417.0" y="259.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">used vs listed</text><rect x="344" y="280" width="146" height="30" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.6"/><text x="417.0" y="299.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">exact quote</text><rect x="344" y="320" width="146" height="30" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.6"/><text x="417.0" y="339.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">synonyms</text><rect x="504" y="160" width="152" height="58" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.6"/><text x="580.0" y="185.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">4. Score fairly</text><text x="580.0" y="200.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">Python rubric</text><line x1="500" y1="110" x2="580" y2="160" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="507" y="240" width="146" height="30" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.6"/><text x="580.0" y="259.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">verify quotes</text><rect x="507" y="280" width="146" height="30" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.6"/><text x="580.0" y="299.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">weights 2 / 1</text><rect x="507" y="320" width="146" height="30" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.6"/><text x="580.0" y="339.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">band + verdict</text><rect x="667" y="160" width="152" height="58" rx="8" fill="#e8f0fe" stroke="#3367d6" stroke-width="1.6"/><text x="743.0" y="185.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">5. Improve resume</text><text x="743.0" y="200.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">P4 Bullet Rewriter</text><line x1="500" y1="110" x2="743" y2="160" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="670" y="240" width="146" height="30" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.6"/><text x="743.0" y="259.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">action verbs</text><rect x="670" y="280" width="146" height="30" rx="5" fill="#ffffff" stroke="#555" stroke-width="1.6"/><text x="743.0" y="299.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">JD wording</text><rect x